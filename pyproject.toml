[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fintech-verification-ledger"
version = "0.1.0"
description = "Risk-gated email verification for a fintech signup flow with an audit ledger."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic[email]>=2.9,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<9"]

[tool.hatch.build.targets.wheel]
packages = ["src/fintech_verification"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
